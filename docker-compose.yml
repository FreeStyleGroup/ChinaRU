version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: china-ru-postgres
    environment:
      POSTGRES_USER: china_ru_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: china_ru
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - china-ru-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U china_ru_user -d china_ru']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: china-ru-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - china-ru-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: china-ru-meilisearch
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: dev_master_key
    ports:
      - '7700:7700'
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - china-ru-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
      interval: 10s
      timeout: 5s
      retries: 5

  storage:
    # SeaweedFS — S3-совместимое хранилище, как в проде (docker-compose.prod.yml).
    image: chrislusf/seaweedfs:4.48
    container_name: china-ru-storage
    environment:
      AWS_ACCESS_KEY_ID: dev_storage
      AWS_SECRET_ACCESS_KEY: dev_storage_secret
    command: ['mini', '-dir=/data', '-s3.port.iceberg=0', '-s3.port.lance=0']
    ports:
      - '8333:8333'
    volumes:
      - storage_data:/data
    networks:
      - china-ru-network
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8333/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  storage_data:

networks:
  china-ru-network:
    driver: bridge
