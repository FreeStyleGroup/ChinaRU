# ════════════════════════════════════════════════════════════════
#  China.ru — пограничный nginx (TLS-терминация + маршрутизация).
#  Домены: china.ru (витрина), api.china.ru (API),
#          admin.china.ru (админка). Сертификаты — Let's Encrypt.
# ════════════════════════════════════════════════════════════════

# HTTP → ACME-challenge + редирект на HTTPS.
server {
  listen 80;
  server_name china.ru www.china.ru api.china.ru admin.china.ru;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

# Витрина (Next.js).
server {
  listen 443 ssl;
  http2 on;
  server_name china.ru www.china.ru;

  ssl_certificate /etc/letsencrypt/live/china.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/china.ru/privkey.pem;

  location / {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# API.
server {
  listen 443 ssl;
  http2 on;
  server_name api.china.ru;

  ssl_certificate /etc/letsencrypt/live/china.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/china.ru/privkey.pem;

  client_max_body_size 5m;

  location / {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Админка (статический SPA за своим nginx).
server {
  listen 443 ssl;
  http2 on;
  server_name admin.china.ru;

  ssl_certificate /etc/letsencrypt/live/china.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/china.ru/privkey.pem;

  location / {
    proxy_pass http://admin:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
