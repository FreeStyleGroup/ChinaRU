# ════════════════════════════════════════════════════════════════
#  China.ru — production stack. Запуск:
#    cp .env.prod.example .env.prod && заполнить секреты
#    docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# ════════════════════════════════════════════════════════════════
services:
  postgres:
    image: postgres:16-alpine
    container_name: china-ru-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-china_ru_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: china_ru
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks: [china-ru-network-prod]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-china_ru_user} -d china_ru']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: china-ru-redis-prod
    volumes:
      - redis_data_prod:/data
    networks: [china-ru-network-prod]
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: china-ru-meilisearch-prod
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - meilisearch_data_prod:/meili_data
    networks: [china-ru-network-prod]
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    # ⚠️ Плавающий тег latest: за ним завтра окажется другая сборка — возможно,
    # с другими условиями лицензии (так Redis уехал с BSD на SSPL). Для реестра
    # ПО это значит, что заявленный состав перестаёт совпадать с фактическим
    # сам по себе. Перед подачей зафиксировать версию тем, что реально запущено:
    #   docker image inspect minio/minio --format '{{index .RepoDigests 0}}'
    # и подставить сюда minio/minio@sha256:... либо конкретный RELEASE-тег.
    image: minio/minio:latest
    container_name: china-ru-minio-prod
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data_prod:/minio_data
    networks: [china-ru-network-prod]
    command: server /minio_data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: china-ru-api
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-china_ru_user}:${POSTGRES_PASSWORD}@postgres:5432/china_ru
      REDIS_URL: redis://redis:6379/0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # 🔥 Умолчаний здесь нет намеренно. Домены задаются только в .env.prod;
      # забытая переменная обязана уронить запуск с внятной ошибкой, а не
      # поднять стек с чужим доменом в cookie и ссылках. На этих умолчаниях
      # уже обжигались: стоял апексный china-ru.ru — домен действующего сайта
      # на Битриксе, которому уходили бы сессионные cookie платформы.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?не задан в .env.prod}
      COOKIE_SECURE: 'true'
      WEB_URL: ${WEB_URL:?не задан в .env.prod}
      ADMIN_URL: ${ADMIN_URL:?не задан в .env.prod}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?не задан в .env.prod}
      BCRYPT_COST: '12'
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-china_ru_minio}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      S3_BUCKET: ${S3_BUCKET:-china-ru}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: 'true'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [china-ru-network-prod]
    expose: ['3001']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL не задан в .env.prod}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL не задан в .env.prod}
    container_name: china-ru-web
    depends_on: [api]
    networks: [china-ru-network-prod]
    expose: ['3000']
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL не задан в .env.prod}
    container_name: china-ru-admin
    depends_on: [api]
    networks: [china-ru-network-prod]
    expose: ['80']
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: china-ru-nginx
    depends_on: [web, api, admin]
    networks: [china-ru-network-prod]
    ports:
      - '80:80'
      - '443:443'
    environment:
      # Домены подставляются в шаблон при старте контейнера.
      # NGINX_ENVSUBST_FILTER ограничивает подстановку этими четырьмя
      # именами: без него envsubst затёр бы $host и $remote_addr
      # самого nginx пустыми строками.
      WEB_HOST: ${WEB_HOST:?WEB_HOST не задан в .env.prod}
      API_HOST: ${API_HOST:?API_HOST не задан в .env.prod}
      ADMIN_HOST: ${ADMIN_HOST:?ADMIN_HOST не задан в .env.prod}
      CERT_NAME: ${CERT_NAME:?CERT_NAME не задан в .env.prod}
      NGINX_ENVSUBST_FILTER: '^(WEB_HOST|API_HOST|ADMIN_HOST|CERT_NAME)$$'
    volumes:
      - ./infra/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot
    restart: unless-stopped

volumes:
  postgres_data_prod:
  redis_data_prod:
  meilisearch_data_prod:
  minio_data_prod:
  certbot_webroot:

networks:
  china-ru-network-prod:
    driver: bridge
