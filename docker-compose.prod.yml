# ════════════════════════════════════════════════════════════════
#  China.ru — production stack. Запуск:
#    cp .env.prod.example .env.prod && заполнить секреты
#    docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# ════════════════════════════════════════════════════════════════
services:
  postgres:
    image: postgres:16-alpine
    container_name: china-ru-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-china_ru_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: china_ru
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks: [china-ru-network-prod]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-china_ru_user} -d china_ru']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: china-ru-redis-prod
    volumes:
      - redis_data_prod:/data
    networks: [china-ru-network-prod]
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  storage:
    # Объектное хранилище файлов — SeaweedFS (Apache-2.0), S3-совместимый API.
    # Режим `weed mini` — все роли на одном узле; по документации SeaweedFS
    # годится для production на одном сервере. Версия закреплена: заявленный
    # в реестре ПО состав должен совпадать с запущенным.
    #
    # Прежде здесь был MinIO. Его образы удалены с Docker Hub (сентябрь 2026),
    # бесплатная редакция не сопровождается, исправления уязвимостей выходят
    # только в коммерческой.
    image: chrislusf/seaweedfs:4.48
    container_name: china-ru-storage-prod
    environment:
      # Единственная учётная запись S3 — та же, с которой ходит API.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY не задан в .env.prod}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY не задан в .env.prod}
    # Каталоги Iceberg и Lance продукту не нужны — не поднимаем лишних служб.
    command: ['mini', '-dir=/data', '-s3.port.iceberg=0', '-s3.port.lance=0']
    volumes:
      - storage_data_prod:/data
    networks: [china-ru-network-prod]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8333/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: china-ru-api
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-china_ru_user}:${POSTGRES_PASSWORD}@postgres:5432/china_ru
      REDIS_URL: redis://redis:6379/0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # 🔥 Умолчаний здесь нет намеренно. Домены задаются только в .env.prod;
      # забытая переменная обязана уронить запуск с внятной ошибкой, а не
      # поднять стек с чужим доменом в cookie и ссылках. На этих умолчаниях
      # уже обжигались: стоял апексный china-ru.ru — домен действующего сайта
      # на Битриксе, которому уходили бы сессионные cookie платформы.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?не задан в .env.prod}
      COOKIE_SECURE: 'true'
      WEB_URL: ${WEB_URL:?не задан в .env.prod}
      ADMIN_URL: ${ADMIN_URL:?не задан в .env.prod}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?не задан в .env.prod}
      BCRYPT_COST: '12'
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY не задан в .env.prod}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY не задан в .env.prod}
      S3_BUCKET: ${S3_BUCKET:-china-ru}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: 'true'
      # ИИ (Контент-завод, прогнозы «Гороскопа», перевод названий товаров).
      # Ключ необязателен: без него API работает в режиме заглушки.
      AI_PROVIDER: ${AI_PROVIDER:-aitunnel}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_IMAGE_MODEL: ${AI_IMAGE_MODEL:-}
      # Почта (подтверждение адреса, восстановление пароля). Без SMTP_HOST письма
      # не отправляются — API предупреждает об этом при запуске.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
    networks: [china-ru-network-prod]
    expose: ['3001']
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3001/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL не задан в .env.prod}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL не задан в .env.prod}
    container_name: china-ru-web
    # Серверные компоненты Next ходят в API напрямую по сети стека (apps/web/src/lib/api.ts).
    # Без этой переменной они стучались на localhost:3001 внутри своего же контейнера,
    # получали отказ, и витрина показывала пустой каталог и «Товары не найдены».
    environment:
      API_URL: http://api:3001
    depends_on: [api]
    networks: [china-ru-network-prod]
    expose: ['3000']
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL не задан в .env.prod}
    container_name: china-ru-admin
    depends_on: [api]
    networks: [china-ru-network-prod]
    expose: ['80']
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: china-ru-nginx
    depends_on: [web, api, admin]
    networks: [china-ru-network-prod]
    ports:
      - '80:80'
      - '443:443'
    environment:
      # Домены подставляются в шаблон при старте контейнера.
      # NGINX_ENVSUBST_FILTER ограничивает подстановку этими четырьмя
      # именами: без него envsubst затёр бы $host и $remote_addr
      # самого nginx пустыми строками.
      WEB_HOST: ${WEB_HOST:?WEB_HOST не задан в .env.prod}
      API_HOST: ${API_HOST:?API_HOST не задан в .env.prod}
      ADMIN_HOST: ${ADMIN_HOST:?ADMIN_HOST не задан в .env.prod}
      CERT_NAME: ${CERT_NAME:?CERT_NAME не задан в .env.prod}
      NGINX_ENVSUBST_FILTER: '^(WEB_HOST|API_HOST|ADMIN_HOST|CERT_NAME)$$'
    volumes:
      - ./infra/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot
    restart: unless-stopped

volumes:
  postgres_data_prod:
  redis_data_prod:
  storage_data_prod:
  certbot_webroot:

networks:
  china-ru-network-prod:
    driver: bridge
