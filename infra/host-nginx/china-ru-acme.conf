# ════════════════════════════════════════════════════════════════
#  China.ru — HTTP-часть для nginx ХОСТИНГА (не контейнера).
#
#  Включается ПЕРВОЙ, до выпуска сертификата: отдаёт проверку ACME
#  certbot'у и уводит остальное на HTTPS. Вторая часть —
#  china-ru-app.conf — ссылается на файлы сертификата и без них не
#  пройдёт `nginx -t`, поэтому включается после выпуска.
#
#  Куда класть (Битрикс-окружение / BitrixVM):
#    /etc/nginx/bx/site_avaliable/china-ru-acme.conf    (именно «avaliable», опечатка штатная)
#    ln -s ../site_avaliable/china-ru-acme.conf /etc/nginx/bx/site_enabled/
#  Затем: nginx -t && systemctl reload nginx
#
#  Остаётся включённой и после запуска: через неё certbot продлевает
#  сертификат.
# ════════════════════════════════════════════════════════════════

server {
  listen 80;
  server_name po.china-ru.ru www.po.china-ru.ru api.po.china-ru.ru admin.po.china-ru.ru;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}
