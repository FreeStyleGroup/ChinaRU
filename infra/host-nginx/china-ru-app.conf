# ════════════════════════════════════════════════════════════════
#  China.ru — конфиг для nginx ХОСТИНГА (не контейнера).
#
#  Для VPS, где рядом живёт действующий сайт на Битрикс-окружении:
#  его nginx держит 80/443, а наш стек поднят через
#  docker-compose.proxy.yml и слушает 127.0.0.1:8080. Эти три
#  server-блока принимают поддомены, терминируют TLS и передают
#  запросы внутрь.
#
#  HTTP-часть (ACME и переадресация на HTTPS) — в china-ru-acme.conf.
#  Она включается первой: этот файл ссылается на сертификат и до его
#  выпуска не пройдёт `nginx -t`.
#
#  🔥 `http2 on;` понимает nginx 1.25.1 и новее. Старее — `nginx -t`
#  ругнётся на неизвестную директиву (сайт не пострадает, reload не
#  выполнится): убрать строки `http2 on;` и писать `listen 443 ssl http2;`.
#
#  Куда класть (Битрикс-окружение / BitrixVM):
#    /etc/nginx/bx/site_avaliable/china-ru-app.conf     (именно «avaliable», опечатка штатная)
#    ln -s ../site_avaliable/china-ru-app.conf /etc/nginx/bx/site_enabled/
#  Обычный nginx (Ubuntu/Debian):
#    /etc/nginx/sites-available/ + симлинк в sites-enabled/
#  Затем: nginx -t && systemctl reload nginx
#
#  Сертификат — один на три домена, выпускается certbot'ом на хосте
#  (см. docs/deploy.md, раздел «За nginx хостинга»). Пути ниже — под
#  каталог первого домена из команды выпуска.
#
#  🔥 X-Forwarded-Proto обязателен: без него приложения внутри считают,
#  что работают по http, и cookie сессии не получают флаг Secure.
# ════════════════════════════════════════════════════════════════

# Витрина.
server {
  listen 443 ssl;
  http2 on;
  server_name po.china-ru.ru www.po.china-ru.ru;

  ssl_certificate     /etc/letsencrypt/live/po.china-ru.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/po.china-ru.ru/privkey.pem;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Next.js отдаёт часть страниц потоком — буферизация только мешает.
    proxy_buffering off;
  }
}

# API.
server {
  listen 443 ssl;
  http2 on;
  server_name api.po.china-ru.ru;

  ssl_certificate     /etc/letsencrypt/live/po.china-ru.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/po.china-ru.ru/privkey.pem;

  # Загрузка аватаров и документов резюме идёт через API — лимит как внутри.
  client_max_body_size 5m;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Под будущий ИИ-стрим (SSE): не копить ответ, отдавать по мере прихода.
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}

# Админка.
server {
  listen 443 ssl;
  http2 on;
  server_name admin.po.china-ru.ru;

  ssl_certificate     /etc/letsencrypt/live/po.china-ru.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/po.china-ru.ru/privkey.pem;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
